name: Format

on:
  push:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.mm'
      - '**.c'
      - .clang-format
      - .clang-format-ignore
      - .github/workflows/format.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==19.1.7
      - name: Check the code is formatted
        run: git ls-files '*.cpp' '*.h' '*.mm' '*.c' | xargs clang-format --dry-run --Werror
