name: Tests

# Unit tests for the shared code (libs/core, libs/webview/js, libs/draw2d) and
# the analyzer's DSP. The plugins' own workflows build and validate them.
on:
  push:
    branches: [main] # other branches run through their pull request
    paths:
      - tests/**
      - libs/core/messages.*
      - libs/core/resources.*
      - libs/webview/js/**
      - libs/gpu/**
      - libs/draw2d/**
      - examples/gpu-analyzer/chardsp_Spectrum.h
      - examples/gpu-analyzer/signalsmith-dsp.cmake
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - tests/**
      - libs/core/messages.*
      - libs/core/resources.*
      - libs/webview/js/**
      - libs/gpu/**
      - libs/draw2d/**
      - examples/gpu-analyzer/chardsp_Spectrum.h
      - examples/gpu-analyzer/signalsmith-dsp.cmake
      - .github/workflows/tests.yml
  workflow_dispatch:

# A newer push cancels the run still going for an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # draw2d_test draws with Mesa's software Vulkan (lavapipe).
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev mesa-vulkan-drivers
      - name: Build and run
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests --parallel 4
          ctest --test-dir build-tests --output-on-failure

  # The same tests under AddressSanitizer and UndefinedBehaviorSanitizer.
  # (ASan hangs at startup on recent macOS, so this runs on Linux.)
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev mesa-vulkan-drivers
      - name: Build and run
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          flags="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_EXE_LINKER_FLAGS="$flags"
          cmake --build build-tests --parallel 4
          ctest --test-dir build-tests --output-on-failure
