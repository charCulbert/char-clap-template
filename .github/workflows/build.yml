name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clap:
    name: CLAP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build CLAP
        run: cmake --build build --target simpleCharClap_clap --config Release --parallel 4

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: simpleCharClap-${{ matrix.os }}
          path: build/**/simpleCharClap.clap
          if-no-files-found: error
