name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clap:
    name: CLAP + VST3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
        # os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm] //uncomment to include arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb xauth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build CLAP
        run: cmake --build build --target simpleCharClap_clap --config Release --parallel 4

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: simpleCharClap-${{ matrix.os }}
          path: build/**/simpleCharClap.clap
          if-no-files-found: error

      - name: Check out clap-validator
        uses: actions/checkout@v4
        with:
          repository: free-audio/clap-validator
          ref: 0.4.1
          path: validator

      - name: Validate CLAP
        shell: bash
        run: |
          plugin=$(find build -name simpleCharClap.clap -print -quit)
          test -n "$plugin"
          cargo run --release --locked --manifest-path validator/Cargo.toml -- validate "$plugin" --only-failed

      - name: Build VST3
        run: cmake --build build --target simpleCharClap_vst3 --config Release --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: simpleCharClap-vst3-${{ matrix.os }}
          path: build/**/simpleCharClap.vst3
          if-no-files-found: error

      - name: Validate VST3 with pluginval (x64 runners)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $platform = switch ('${{ runner.os }}') {
            'macOS' { 'macOS' }
            'Linux' { 'Linux' }
            'Windows' { 'Windows' }
          }
          $url = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_$platform.zip"
          Invoke-WebRequest $url -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-dist
          $plugin = Get-ChildItem build -Directory -Filter simpleCharClap.vst3 -Recurse | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found' }
          $binary = switch ($platform) {
            'macOS' { './pluginval-dist/pluginval.app/Contents/MacOS/pluginval' }
            'Linux' { './pluginval-dist/pluginval' }
            'Windows' { './pluginval-dist/pluginval.exe' }
          }
          if ($platform -eq 'Linux') {
            & xvfb-run -a $binary --validate $plugin.FullName --strictness-level 5 --skip-gui-tests
          } else {
            & $binary --validate $plugin.FullName --strictness-level 5 --skip-gui-tests
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
