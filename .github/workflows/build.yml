name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clap:
    name: CLAP + VST3 (${{ matrix.os }}, ${{ matrix.ui }} UI)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        ui: [web, gpu]
        # os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm] //uncomment to include arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio and WebView headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev mesa-vulkan-drivers xvfb xauth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIMPLECHAR_BUILD_TESTS=ON -DSIMPLECHAR_UI=${{ matrix.ui }}

      - name: Unit tests
        run: |
          cmake --build build --target resources_test messages_test --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Build CLAP
        run: cmake --build build --target simpleCharClap_clap --config Release --parallel 4

      - name: Check out clap-validator
        uses: actions/checkout@v4
        with:
          repository: free-audio/clap-validator
          ref: 0.4.1
          path: validator

      - name: Validate CLAP
        shell: bash
        run: |
          plugin=$(find build -name simpleCharClap.clap -print -quit)
          test -n "$plugin"
          cargo run --release --locked --manifest-path validator/Cargo.toml -- validate "$plugin" --only-failed

      - name: Build VST3
        run: cmake --build build --target simpleCharClap_vst3 --config Release --parallel 4

      # Includes pluginval's editor tests, which open the web UI in its window.
      - name: Validate VST3 with pluginval (x64 runners)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $platform = switch ('${{ runner.os }}') {
            'macOS' { 'macOS' }
            'Linux' { 'Linux' }
            'Windows' { 'Windows' }
          }
          $url = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_$platform.zip"
          Invoke-WebRequest $url -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-dist
          $plugin = Get-ChildItem build -Filter simpleCharClap.vst3 -Recurse -Directory | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 artifact not found' }
          $binary = switch ($platform) {
            'macOS' { './pluginval-dist/pluginval.app/Contents/MacOS/pluginval' }
            'Linux' { './pluginval-dist/pluginval' }
            'Windows' { './pluginval-dist/pluginval.exe' }
          }
          if ($platform -eq 'Linux') {
            & xvfb-run -a $binary --validate $plugin.FullName --strictness-level 5
          } else {
            & $binary --validate $plugin.FullName --strictness-level 5
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validated CLAP
        uses: actions/upload-artifact@v4
        with:
          name: simpleCharClap-${{ matrix.os }}-${{ matrix.ui }}
          # Windows/Linux CLAPs are single files with their UI in simpleCharClap.clap.resources/.
          path: |
            build/**/simpleCharClap.clap
            build/**/simpleCharClap.clap.resources
          if-no-files-found: error

      - name: Upload validated VST3
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: simpleCharClap-vst3-${{ matrix.os }}-${{ matrix.ui }}
          path: build/**/simpleCharClap.vst3
          if-no-files-found: error

  wclap:
    name: WCLAP (${{ matrix.ui }} UI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ui: [web, gpu]
    steps:
      - uses: actions/checkout@v4

      # The gpu UI's page is compiled with Emscripten.
      - name: Install Emscripten
        if: matrix.ui == 'gpu'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Install wasi-sdk
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar xz
          echo "WASI_SDK=$PWD/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build-wclap -DCMAKE_BUILD_TYPE=Release -DSIMPLECHAR_UI=${{ matrix.ui }} -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK/share/cmake/wasi-sdk.cmake"
          cmake --build build-wclap --target simpleCharClap_wclap_bundle --parallel 4

      - name: Check the archive layout
        run: |
          tar tzf build-wclap/simpleCharClap.wclap.tar.gz | tee contents.txt
          grep -qx 'module.wasm' contents.txt
          grep -qx 'webUI/index.html' contents.txt

      - name: Upload WCLAP
        uses: actions/upload-artifact@v4
        with:
          name: simpleCharClap-wclap-${{ matrix.ui }}
          path: build-wclap/simpleCharClap.wclap.tar.gz
          if-no-files-found: error
